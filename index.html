<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 · 丛林对抗</title>
    <style>
        /* ===== 全局重置 & 丛林主题 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #1d3b1a;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #app {
            background: #2a5a2a;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 2px 0 #5a8a3a;
            border: 4px solid #3d6b2e;
            position: relative;
        }
        .panel {
            background: #2e4d2a;
            border-radius: 20px;
            padding: 20px 25px;
            border: 2px solid #5f8b4a;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            color: #e4f0d0;
        }
        .btn {
            background: #5f8b4a;
            border: none;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #1d2f1a;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #2f4d25;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: #7ab35a;
            box-shadow: 0 6px 0 #2f4d25;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #2f4d25;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 4px 0 #2f4d25;
            cursor: not-allowed;
        }
        .btn-small {
            padding: 6px 16px;
            font-size: 14px;
        }
        /* ===== 主菜单 ===== */
        #menu-screen {
            text-align: center;
            padding: 30px 20px;
            min-width: 400px;
        }
        #menu-screen h1 {
            font-size: 52px;
            color: #f5e56b;
            text-shadow: 4px 4px 0 #3d5a2a, 0 0 30px #b3d97a;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        #menu-screen .sub {
            color: #b3d97a;
            font-size: 20px;
            margin-bottom: 30px;
            border-bottom: 2px dashed #5f8b4a;
            padding-bottom: 15px;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .menu-buttons .btn {
            width: 200px;
            font-size: 22px;
            padding: 14px 0;
        }
        /* ===== 选择界面 ===== */
        #selection-screen {
            display: none;
            padding: 20px 20px 10px;
            min-width: 700px;
        }
        .sel-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .sel-group {
            background: #3d5f33;
            border-radius: 16px;
            padding: 14px 18px;
            flex: 1;
            min-width: 160px;
            border: 2px solid #5f8b4a;
        }
        .sel-group h3 {
            color: #f5e56b;
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
        }
        .sel-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .sel-options .opt {
            background: #2a4d2a;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 14px;
            color: #d4e8c0;
            transition: 0.15s;
        }
        .sel-options .opt:hover {
            background: #4a7a3a;
        }
        .sel-options .opt.active {
            border-color: #f5e56b;
            background: #4a7a3a;
            color: #fff;
            box-shadow: 0 0 12px #f5e56b88;
        }
        .skin-preview {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #888;
            vertical-align: middle;
            margin-right: 6px;
        }
        .opt .skin-name {
            vertical-align: middle;
        }
        /* ===== 游戏界面 ===== */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        #game-canvas {
            display: block;
            background: #3a6b3a;
            border-radius: 16px;
            border: 4px solid #5f8b4a;
            box-shadow: inset 0 0 30px #1d3b1a;
            cursor: crosshair;
        }
        .game-hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px 4px;
            color: #d4e8c0;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #1d2f1a;
        }
        .game-hud .score span {
            color: #f5e56b;
            font-size: 24px;
            margin: 0 6px;
        }
        .game-hud .round {
            background: #2f4d25;
            padding: 4px 18px;
            border-radius: 30px;
            border: 2px solid #5f8b4a;
        }
        .game-hud .controls {
            font-size: 14px;
            color: #b3d97a;
        }
        /* ===== 嘲讽气泡 ===== */
        .taunt-bubble {
            position: fixed;
            background: rgba(255, 255, 240, 0.95);
            color: #1d2f1a;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 3px solid #f5e56b;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            transition: opacity 0.2s;
            opacity: 0;
        }
        .taunt-bubble::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            border: 10px solid transparent;
            border-top-color: rgba(255, 255, 240, 0.95);
        }
        .taunt-bubble.show {
            opacity: 1;
        }
        /* ===== 装备库 ===== */
        #equipment-screen {
            display: none;
            padding: 20px;
            min-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .equip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #5f8b4a;
            padding-bottom: 10px;
        }
        .equip-header .gold {
            color: #f5e56b;
            font-size: 24px;
        }
        .equip-section {
            margin-bottom: 25px;
        }
        .equip-section h2 {
            color: #f5e56b;
            font-size: 20px;
            border-left: 6px solid #f5e56b;
            padding-left: 12px;
            margin-bottom: 12px;
        }
        .upgrade-item,
        .skin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2f4d25;
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 8px;
            border: 1px solid #5f8b4a;
        }
        .upgrade-item .info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .upgrade-item .info .name {
            font-weight: bold;
            color: #e4f0d0;
        }
        .upgrade-item .info .desc {
            font-size: 13px;
            color: #b3d97a;
        }
        .upgrade-item .level {
            margin: 0 16px;
            color: #f5e56b;
            font-weight: bold;
        }
        .skin-item .preview {
            display: inline-block;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #888;
            margin-right: 16px;
        }
        .skin-item .sname {
            flex: 1;
            font-weight: bold;
        }
        .skin-item .status {
            margin-right: 12px;
            color: #b3d97a;
        }
        #equipment-screen::-webkit-scrollbar {
            width: 8px;
        }
        #equipment-screen::-webkit-scrollbar-track {
            background: #1d3b1a;
        }
        #equipment-screen::-webkit-scrollbar-thumb {
            background: #5f8b4a;
            border-radius: 10px;
        }
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .mt-10 {
            margin-top: 10px;
        }
        /* ===== 模态框（轮结束菜单）- 强制显示 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none !important;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active {
            display: flex !important;
        }
        .modal-content {
            background: #2e4d2a;
            padding: 40px 50px;
            border-radius: 30px;
            border: 4px solid #f5e56b;
            text-align: center;
            box-shadow: 0 0 60px rgba(245, 229, 107, 0.3);
            min-width: 300px;
        }
        .modal-content h2 {
            color: #f5e56b;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .modal-content p {
            color: #d4e8c0;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .modal-content .btn {
            margin: 0 10px;
            min-width: 120px;
        }
        @media (max-width: 750px) {
            #selection-screen,
            #equipment-screen {
                min-width: 0;
                width: 100%;
                padding: 12px;
            }
            #menu-screen {
                min-width: 0;
                padding: 20px 10px;
            }
            #menu-screen h1 {
                font-size: 36px;
            }
            .sel-group {
                min-width: 120px;
            }
            .game-hud {
                font-size: 14px;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }
            .modal-content {
                padding: 30px 20px;
                min-width: auto;
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- ========== 主菜单 ========== -->
        <div id="menu-screen" class="panel">
            <h1>🌿 坦克大战</h1>
            <div class="sub">丛林对抗 · 子弹反弹</div>
            <div class="menu-buttons">
                <button class="btn" id="btn-start">⚔️ 开始战斗</button>
                <button class="btn" id="btn-equip">🔧 装备库</button>
            </div>
            <div style="margin-top:20px; font-size:14px; color:#8aac7a;">方向键移动 · M射击</div>
        </div>

        <!-- ========== 选择界面 ========== -->
        <div id="selection-screen" class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 style="color:#f5e56b;">⚙️ 选择配置</h2>
                <button class="btn btn-small" id="sel-back">← 返回</button>
            </div>
            <div class="sel-row">
                <div class="sel-group">
                    <h3>🎯 难度</h3>
                    <div class="sel-options" id="diff-options">
                        <span class="opt" data-value="easy">简单</span>
                        <span class="opt active" data-value="normal">普通</span>
                        <span class="opt" data-value="hard">困难</span>
                    </div>
                </div>
                <div class="sel-group">
                    <h3>🚀 型号</h3>
                    <div class="sel-options" id="type-options">
                        <span class="opt active" data-value="balanced">均衡</span>
                        <span class="opt" data-value="heavy">重装</span>
                        <span class="opt" data-value="speedy">极速</span>
                    </div>
                </div>
                <div class="sel-group">
                    <h3>🎨 皮肤</h3>
                    <div class="sel-options" id="skin-options">
                        <!-- 由js动态渲染 -->
                    </div>
                </div>
            </div>
            <div class="flex-center mt-10">
                <button class="btn" id="sel-go">🔥 进入战场</button>
            </div>
        </div>

        <!-- ========== 游戏界面 ========== -->
        <div id="game-screen" class="panel" style="padding:12px;">
            <div class="game-hud">
                <div class="score">🏆 <span id="score-player">0</span> : <span id="score-ai">0</span></div>
                <div class="round">第 <span id="round-num">1</span> 轮</div>
                <div class="controls">↑↓←→ 移动 · M 射击</div>
            </div>
            <canvas id="game-canvas" width="800" height="600"></canvas>
            <div style="display:flex; justify-content:space-between; width:100%; margin-top:8px;">
                <button class="btn btn-small" id="game-back">🏠 退出</button>
                <span id="game-status" style="color:#b3d97a; font-size:16px;"></span>
            </div>
        </div>

        <!-- ========== 装备库 ========== -->
        <div id="equipment-screen" class="panel">
            <div class="equip-header">
                <h2 style="color:#f5e56b;">🔧 装备库</h2>
                <div style="display:flex; gap:16px; align-items:center;">
                    <span class="gold">💰 <span id="equip-gold">0</span></span>
                    <button class="btn btn-small" id="equip-back">← 返回</button>
                </div>
            </div>
            <div class="equip-section">
                <h2>⬆️ 升级</h2>
                <div id="upgrade-list"></div>
            </div>
            <div class="equip-section">
                <h2>🎨 皮肤</h2>
                <div id="skin-list"></div>
            </div>
        </div>

    </div>

    <!-- ========== 模态框（轮结束菜单） ========== -->
    <div class="modal-overlay" id="round-modal">
        <div class="modal-content">
            <h2 id="modal-title">🎉 本轮结束</h2>
            <p id="modal-desc">你赢得了本轮！</p>
            <div>
                <button class="btn" id="modal-next">➡️ 下一轮</button>
                <button class="btn" id="modal-menu">🏠 主菜单</button>
            </div>
        </div>
    </div>

    <!-- 嘲讽气泡容器 -->
    <div id="taunt-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999;"></div>

    <script>
        // ================================================================
        //  CONFIG 数据
        // ================================================================

        const TANK_TYPES = {
            balanced: { name: '均衡', speed: 2.8, fireRate: 28, hp: 4, damage: 1.0, color: '#5f9e4a' },
            heavy: { name: '重装', speed: 2.0, fireRate: 26, hp: 7, damage: 1.3, color: '#b5533a' },
            speedy: { name: '极速', speed: 4.2, fireRate: 32, hp: 3, damage: 0.7, color: '#3a8fc9' },
        };

        const DIFFICULTY = {
            easy: { aiSpeedMult: 0.6, aiFireInterval: 120, aiAimError: 25, bulletSpeedMult: 0.9 },
            normal: { aiSpeedMult: 1.0, aiFireInterval: 70, aiAimError: 10, bulletSpeedMult: 1.1 },
            hard: { aiSpeedMult: 1.3, aiFireInterval: 40, aiAimError: 3, bulletSpeedMult: 1.4 },
        };

        const UPGRADES = [
            { id: 'power', name: '动力核心', desc: '+10% 伤害', maxLevel: 10, baseCost: 100, costInc: 50,
                effect: lv => 1 + 0.1 * lv },
            { id: 'armor', name: '船体装甲', desc: '+20 生命', maxLevel: 10, baseCost: 150, costInc: 60,
                effect: lv => 20 * lv },
            { id: 'fireRate', name: '射速提升', desc: '-5% 冷却', maxLevel: 10, baseCost: 120, costInc: 55,
                effect: lv => 1 - 0.05 * lv },
            { id: 'bulletSpeed', name: '弹道强化', desc: '+8% 子弹速度', maxLevel: 10, baseCost: 130, costInc: 50,
                effect: lv => 1 + 0.08 * lv },
            { id: 'bounce', name: '反弹精通', desc: '+1 最大反弹', maxLevel: 5, baseCost: 200, costInc: 80,
                effect: lv => lv },
            { id: 'moveSpeed', name: '移动强化', desc: '+5% 速度', maxLevel: 10, baseCost: 100, costInc: 40,
                effect: lv => 1 + 0.05 * lv },
        ];

        const SKIN_CONFIG = [
            { id: 'default', name: '默认', price: 0, color: '#5f9e4a', default: true },
            { id: 'neon', name: '霓虹突击者', price: 1000, color: '#ff44cc' },
            { id: 'gold', name: '黄金之神', price: 5000, color: '#f5d742' },
            { id: 'camo', name: '丛林迷彩', price: 2000, color: '#6a8e4a' },
        ];

        const TAUNTS = {
            playerMiss: [
                "孩子们，瞄哪呢？", "你错了！", "这都能打偏？",
                "就这？", "你在玩什么？"
            ],
            playerHit: [
                "孩子们，痛不痛？", "回家喝杯吧！", "太慢了！",
                "就这水平也敢来？", "这波怎么说？"
            ],
            playerContinuousMiss: [
                "孩子们，你行不行啊？", "细狗，你倒是打啊！",
                "我站这里你都打不中？", "枪法被狗吃了？", "你无敌了，孩子！"
            ],
            aiHitPlayer: [
                "孩子们，我猛不猛？", "爽！", "看到没？",
                "这就是实力！", "服不服？"
            ],
            playerIdle: [
                "孩子们，睡着了？", "开炮啊！", "你在挂机吗？", "快来打我呀~"
            ],
            aiWinRound: [
                "孩子们，我赢了！", "就这？还没出力你就倒了",
                "菜鸡！下一位！", "这波我无敌！"
            ],
            playerWinRound: [
                "孩子们，你运气好！", "再来！我让着你呢！",
                "哼，下次不会了！", "这局不算，重来！"
            ],
        };

        // ================================================================
        //  存储工具
        // ================================================================
        const STORAGE_KEY = 'tank_game_data';

        function loadStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (!data.gold) data.gold = 0;
                    if (!data.upgrades) data.upgrades = {};
                    if (!data.skins) data.skins = {};
                    if (!data.equippedSkin) data.equippedSkin = 'default';
                    UPGRADES.forEach(u => { if (data.upgrades[u.id] === undefined) data.upgrades[u.id] = 0; });
                    SKIN_CONFIG.forEach(s => {
                        if (data.skins[s.id] === undefined) data.skins[s.id] = s.default ? true : false;
                    });
                    return data;
                }
            } catch (e) { console.warn('存储读取失败', e); }
            const init = {
                gold: 0,
                upgrades: {},
                skins: {},
                equippedSkin: 'default',
            };
            UPGRADES.forEach(u => init.upgrades[u.id] = 0);
            SKIN_CONFIG.forEach(s => init.skins[s.id] = s.default ? true : false);
            return init;
        }

        function saveStorage(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // ================================================================
        //  游戏全局状态
        // ================================================================
        let gameData = loadStorage();
        let currentDifficulty = 'normal';
        let currentType = 'balanced';
        let currentSkin = gameData.equippedSkin || 'default';

        let canvas, ctx;
        let gameRunning = false;
        let paused = false;
        let animId = null;
        let player, enemy;
        let bullets = [];
        let walls = [];
        let mapIndex = 0;
        let roundNum = 1;
        let roundWinsP = 0,
            roundWinsAI = 0; // 轮胜次数
        const TARGET_WINS = 3; // 整局目标轮胜
        const MAX_BOUNCE_DEFAULT = 3;
        let roundActive = true;
        let frameCount = 0;
        let playerFireCooldown = 0;
        let playerIdleTimer = 0;
        let playerMissCount = 0;
        let tauntCooldowns = {};
        let aiController = null;
        let playerShotThisFrame = false;
        let roundWinner = null; // 用于记录本轮赢家

        // 地图池（5张）
        const MAPS = [
            { walls: [
                    [120, 80, 20, 200],
                    [300, 60, 180, 20],
                    [580, 80, 20, 180],
                    [200, 280, 20, 160],
                    [400, 300, 20, 160],
                    [600, 380, 160, 20],
                    [80, 460, 160, 20],
                    [320, 480, 20, 100],
                    [500, 460, 180, 20]
                ], spawnP: [60, 60], spawnE: [720, 520] },
            { walls: [
                    [60, 150, 200, 20],
                    [60, 400, 20, 160],
                    [280, 100, 20, 200],
                    [280, 380, 20, 180],
                    [460, 150, 180, 20],
                    [460, 400, 20, 160],
                    [620, 100, 20, 200],
                    [620, 380, 20, 180],
                    [200, 250, 160, 20],
                    [480, 250, 160, 20]
                ], spawnP: [40, 40], spawnE: [740, 540] },
            { walls: [
                    [100, 100, 20, 120],
                    [100, 360, 20, 120],
                    [340, 60, 20, 180],
                    [340, 360, 20, 180],
                    [580, 100, 20, 120],
                    [580, 360, 20, 120],
                    [180, 200, 120, 20],
                    [400, 200, 120, 20],
                    [180, 380, 120, 20],
                    [400, 380, 120, 20],
                    [40, 540, 180, 20],
                    [580, 540, 180, 20]
                ], spawnP: [50, 50], spawnE: [730, 530] },
            { walls: [
                    [80, 80, 160, 20],
                    [80, 500, 160, 20],
                    [560, 80, 160, 20],
                    [560, 500, 160, 20],
                    [280, 160, 20, 120],
                    [280, 320, 20, 120],
                    [500, 160, 20, 120],
                    [500, 320, 20, 120],
                    [160, 240, 120, 20],
                    [400, 240, 120, 20],
                    [160, 420, 120, 20],
                    [400, 420, 120, 20],
                    [360, 60, 80, 20],
                    [360, 520, 80, 20]
                ], spawnP: [40, 280], spawnE: [740, 280] },
            { walls: [
                    [60, 60, 20, 480],
                    [720, 60, 20, 480],
                    [60, 60, 680, 20],
                    [60, 520, 680, 20],
                    [160, 140, 20, 120],
                    [160, 340, 20, 120],
                    [360, 100, 20, 120],
                    [360, 380, 20, 120],
                    [560, 140, 20, 120],
                    [560, 340, 20, 120],
                    [240, 200, 120, 20],
                    [440, 200, 120, 20],
                    [240, 380, 120, 20],
                    [440, 380, 120, 20],
                    [100, 280, 60, 20],
                    [600, 280, 60, 20],
                ], spawnP: [40, 40], spawnE: [740, 540] }
        ];

        // ================================================================
        //  工具函数
        // ================================================================
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function rectCollide(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
                r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        // ================================================================
        //  坦克类
        // ================================================================
        class Tank {
            constructor(x, y, typeKey, skinId, isPlayer = true) {
                this.x = x;
                this.y = y;
                this.w = 40;
                this.h = 40;
                this.typeKey = typeKey;
                this.skinId = skinId || 'default';
                this.isPlayer = isPlayer;
                this.angle = isPlayer ? 0 : Math.PI;
                this.hp = 3;
                this.maxHp = 3;
                this.speed = 2.8;
                this.fireRate = 28;
                this.damage = 1;
                this.bulletSpeed = 4.5;
                this.maxBounce = MAX_BOUNCE_DEFAULT;
                this.cooldown = 0;
                this.alive = true;
                this.recalcStats();
            }

            recalcStats() {
                const base = TANK_TYPES[this.typeKey];
                if (!base) return;
                let spd = base.speed;
                let fr = base.fireRate;
                let hp = base.hp;
                let dmg = base.damage;
                let bspd = 4.5;
                let mb = MAX_BOUNCE_DEFAULT;

                const up = gameData.upgrades;
                const powerLv = up.power || 0;
                const armorLv = up.armor || 0;
                const fireLv = up.fireRate || 0;
                const bulletLv = up.bulletSpeed || 0;
                const bounceLv = up.bounce || 0;
                const moveLv = up.moveSpeed || 0;

                const powerMult = 1 + 0.1 * powerLv;
                const armorAdd = 20 * armorLv;
                const fireMult = 1 - 0.05 * fireLv;
                const bulletMult = 1 + 0.08 * bulletLv;
                const bounceAdd = bounceLv;
                const moveMult = 1 + 0.05 * moveLv;

                this.speed = spd * moveMult;
                this.fireRate = Math.max(8, fr * fireMult);
                this.maxHp = hp + armorAdd;
                this.hp = this.maxHp;
                this.damage = dmg * powerMult;
                this.bulletSpeed = bspd * bulletMult;
                this.maxBounce = Math.min(8, MAX_BOUNCE_DEFAULT + bounceAdd);
            }

            getSkinColor() {
                const skin = SKIN_CONFIG.find(s => s.id === this.skinId);
                return skin ? skin.color : '#5f9e4a';
            }

            draw(ctx) {
                if (!this.alive) return;
                const cx = this.x,
                    cy = this.y;
                const color = this.getSkinColor();
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(this.angle);
                ctx.fillStyle = '#3d3d3d';
                ctx.fillRect(-22, -18, 44, 8);
                ctx.fillRect(-22, 10, 44, 8);
                ctx.fillStyle = color;
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 8;
                ctx.fillRect(-18, -14, 36, 28);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#3a3a3a';
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#5a5a5a';
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(6, -4, 20, 8);
                ctx.fillStyle = '#111';
                ctx.fillRect(24, -3, 6, 6);
                ctx.restore();
                const hpPct = this.hp / this.maxHp;
                ctx.fillStyle = '#222';
                ctx.fillRect(this.x - 20, this.y - 30, 40, 6);
                ctx.fillStyle = hpPct > 0.5 ? '#4caf50' : '#f44336';
                ctx.fillRect(this.x - 20, this.y - 30, 40 * hpPct, 6);
                if (this.isPlayer) {
                    ctx.fillStyle = '#fff';
                    ctx.font = '14px sans-serif';
                    ctx.fillText('玩家', this.x - 16, this.y - 38);
                } else {
                    ctx.fillStyle = '#ffaa00';
                    ctx.font = '14px sans-serif';
                    ctx.fillText('AI', this.x - 10, this.y - 38);
                }
            }

            getGunTip() {
                const len = 26;
                return { x: this.x + Math.cos(this.angle) * len, y: this.y + Math.sin(this.angle) * len };
            }

            fire() {
                if (this.cooldown > 0 || !this.alive) return null;
                this.cooldown = this.fireRate;
                const tip = this.getGunTip();
                const b = new Bullet(tip.x, tip.y, this.angle, this.bulletSpeed, this.damage, this.maxBounce, this.isPlayer ?
                    'player' : 'enemy');
                return b;
            }

            update() {
                if (this.cooldown > 0) this.cooldown--;
            }

            collidesWithWalls(walls) {
                const rect = { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h };
                for (let w of walls) {
                    if (rectCollide(rect, w)) return true;
                }
                return false;
            }

            tryMove(dx, dy, walls) {
                const oldX = this.x,
                    oldY = this.y;
                this.x += dx;
                this.y += dy;
                const halfW = this.w / 2,
                    halfH = this.h / 2;
                this.x = clamp(this.x, halfW, 800 - halfW);
                this.y = clamp(this.y, halfH, 600 - halfH);
                if (this.collidesWithWalls(walls)) {
                    this.x = oldX;
                    this.y = oldY;
                    return false;
                }
                return true;
            }
        }

        // ================================================================
        //  子弹类
        // ================================================================
        class Bullet {
            constructor(x, y, angle, speed, damage, maxBounce, owner) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.speed = speed;
                this.damage = damage;
                this.maxBounce = maxBounce;
                this.bounceCount = 0;
                this.owner = owner;
                this.radius = 5;
                this.alive = true;
                this.hitTarget = false;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }

            update(walls) {
                if (!this.alive) return;
                this.x += this.vx;
                this.y += this.vy;

                const r = this.radius;
                if (this.x - r < 0) { this.x = r;
                    this.vx = -this.vx;
                    this.bounceCount++; } else if (this.x + r > 800) { this.x = 800 - r;
                    this.vx = -this.vx;
                    this.bounceCount++; }
                if (this.y - r < 0) { this.y = r;
                    this.vy = -this.vy;
                    this.bounceCount++; } else if (this.y + r > 600) { this.y = 600 - r;
                    this.vy = -this.vy;
                    this.bounceCount++; }

                for (let w of walls) {
                    const nearX = clamp(this.x, w.x, w.x + w.w);
                    const nearY = clamp(this.y, w.y, w.y + w.h);
                    const dx = this.x - nearX,
                        dy = this.y - nearY;
                    const dist = Math.hypot(dx, dy);
                    if (dist < this.radius) {
                        if (Math.abs(dx) > Math.abs(dy)) {
                            this.vx = -this.vx;
                        } else {
                            this.vy = -this.vy;
                        }
                        this.bounceCount++;
                        const overlap = this.radius - dist;
                        this.x += overlap * (dx / (dist || 1));
                        this.y += overlap * (dy / (dist || 1));
                        break;
                    }
                }

                if (this.bounceCount > this.maxBounce) {
                    this.alive = false;
                }
            }

            draw(ctx) {
                if (!this.alive) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
                ctx.fillStyle = this.owner === 'player' ? '#ffdd44' : '#ff5533';
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(this.x - this.vx * 0.5, this.y - this.vy * 0.5, this.radius * 0.6, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,200,100,0.4)';
                ctx.fill();
            }

            hitsTank(tank) {
                if (!this.alive || !tank.alive) return false;
                const dx = this.x - tank.x,
                    dy = this.y - tank.y;
                const dist = Math.hypot(dx, dy);
                return dist < (this.radius + tank.w / 2);
            }
        }

        // ================================================================
        //  AI 逻辑
        // ================================================================
        class AIController {
            constructor(tank, difficulty) {
                this.tank = tank;
                this.diff = difficulty;
                this.fireTimer = 0;
                this.stuckCounter = 0;
                this.lastX = tank.x;
                this.lastY = tank.y;
            }

            update(player, walls) {
                const tank = this.tank;
                if (!tank.alive) return;

                const diffCfg = DIFFICULTY[this.diff];
                const spd = tank.speed * diffCfg.aiSpeedMult;
                const fireInterval = diffCfg.aiFireInterval;
                const aimError = diffCfg.aiAimError;

                const dx = player.x - tank.x,
                    dy = player.y - tank.y;
                const ang = Math.atan2(dy, dx);
                const error = (Math.random() - 0.5) * aimError * 0.02;
                const targetAngle = ang + error;

                let diffAngle = targetAngle - tank.angle;
                while (diffAngle > Math.PI) diffAngle -= 2 * Math.PI;
                while (diffAngle < -Math.PI) diffAngle += 2 * Math.PI;
                const turnSpeed = 0.06;
                if (Math.abs(diffAngle) < turnSpeed) {
                    tank.angle = targetAngle;
                } else {
                    tank.angle += Math.sign(diffAngle) * turnSpeed;
                }

                const distToPlayer = dist(tank, player);
                let moveX = 0,
                    moveY = 0;
                if (distToPlayer > 150) {
                    moveX = Math.cos(tank.angle) * spd;
                    moveY = Math.sin(tank.angle) * spd;
                } else if (distToPlayer < 80) {
                    moveX = -Math.cos(tank.angle) * spd * 0.6;
                    moveY = -Math.sin(tank.angle) * spd * 0.6;
                } else {
                    const side = Math.sin(Date.now() / 1000 + tank.x) > 0 ? 1 : -1;
                    moveX = Math.cos(tank.angle + Math.PI / 2 * side) * spd * 0.4;
                    moveY = Math.sin(tank.angle + Math.PI / 2 * side) * spd * 0.4;
                }

                if (moveX !== 0 || moveY !== 0) {
                    if (!tank.tryMove(moveX, 0, walls)) {
                        moveX = 0;
                    }
                    if (!tank.tryMove(0, moveY, walls)) {
                        moveY = 0;
                    }
                    if (moveX === 0 && moveY === 0) {
                        this.stuckCounter++;
                        if (this.stuckCounter > 10) {
                            tank.angle += (Math.random() - 0.5) * 1.5;
                            this.stuckCounter = 0;
                        }
                    } else {
                        this.stuckCounter = 0;
                    }
                }

                this.fireTimer--;
                if (this.fireTimer <= 0) {
                    const chance = this.diff === 'easy' ? 0.6 : (this.diff === 'normal' ? 0.85 : 1.0);
                    if (Math.random() < chance && distToPlayer < 500) {
                        const bullet = tank.fire();
                        if (bullet) {
                            const err = (Math.random() - 0.5) * aimError * 0.03;
                            bullet.angle += err;
                            bullet.vx = Math.cos(bullet.angle) * bullet.speed;
                            bullet.vy = Math.sin(bullet.angle) * bullet.speed;
                            bullets.push(bullet);
                        }
                    }
                    this.fireTimer = fireInterval + randInt(-10, 10);
                }

                tank.update();

                if (Math.abs(tank.x - this.lastX) < 0.5 && Math.abs(tank.y - this.lastY) < 0.5) {
                    this.stuckCounter++;
                    if (this.stuckCounter > 15) {
                        tank.angle += (Math.random() - 0.5) * 2;
                        this.stuckCounter = 0;
                    }
                } else {
                    this.stuckCounter = 0;
                }
                this.lastX = tank.x;
                this.lastY = tank.y;
            }
        }

        // ================================================================
        //  嘲讽系统
        // ================================================================
        function triggerTaunt(eventType) {
            const now = Date.now();
            if (tauntCooldowns[eventType] && now - tauntCooldowns[eventType] < 8000) return;
            const msgs = TAUNTS[eventType];
            if (!msgs) return;
            const msg = msgs[Math.floor(Math.random() * msgs.length)];
            showTauntBubble(msg);
            tauntCooldowns[eventType] = now;
        }

        let activeBubble = null;
        let bubbleTimeout = null;

        function showTauntBubble(text) {
            if (activeBubble) {
                activeBubble.remove();
                activeBubble = null;
                if (bubbleTimeout) clearTimeout(bubbleTimeout);
            }
            const container = document.getElementById('taunt-container');
            const bubble = document.createElement('div');
            bubble.className = 'taunt-bubble';
            bubble.textContent = text;
            if (enemy && enemy.alive) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = rect.left + enemy.x / scaleX;
                const y = rect.top + enemy.y / scaleY - 20;
                bubble.style.left = x + 'px';
                bubble.style.top = y + 'px';
            } else {
                bubble.style.left = '50%';
                bubble.style.top = '30%';
            }
            container.appendChild(bubble);
            requestAnimationFrame(() => {
                bubble.classList.add('show');
            });
            activeBubble = bubble;
            bubbleTimeout = setTimeout(() => {
                if (bubble && bubble.parentNode) {
                    bubble.classList.remove('show');
                    setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, 300);
                }
                if (bubbleTimeout) { bubbleTimeout = null; }
                if (activeBubble === bubble) activeBubble = null;
            }, 2000);
        }

        // ================================================================
        //  地图加载
        // ================================================================
        function loadMap(index) {
            const map = MAPS[index % MAPS.length];
            walls = map.walls.map(w => ({ x: w[0], y: w[1], w: w[2], h: w[3] }));
            if (player) {
                player.x = map.spawnP[0];
                player.y = map.spawnP[1];
                player.hp = player.maxHp;
                player.alive = true;
                player.angle = 0;
            }
            if (enemy) {
                enemy.x = map.spawnE[0];
                enemy.y = map.spawnE[1];
                enemy.hp = enemy.maxHp;
                enemy.alive = true;
                enemy.angle = Math.PI;
            }
            bullets = [];
            roundActive = true;
            playerMissCount = 0;
            document.getElementById('round-num').textContent = roundNum;
            document.getElementById('score-player').textContent = roundWinsP;
            document.getElementById('score-ai').textContent = roundWinsAI;
        }

        // ================================================================
        //  游戏初始化 & 循环
        // ================================================================
        function initGame() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            player = new Tank(60, 60, currentType, currentSkin, true);
            enemy = new Tank(720, 520, 'balanced', 'default', false);
            enemy.angle = Math.PI;
            player.recalcStats();
            enemy.recalcStats();
            roundWinsP = 0;
            roundWinsAI = 0;
            roundNum = 1;
            mapIndex = 0;
            loadMap(0);
            aiController = new AIController(enemy, currentDifficulty);
            tauntCooldowns = {};
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('equipment-screen').style.display = 'none';
            document.getElementById('game-status').textContent = '';
            paused = false;
            gameRunning = true;
            if (animId) cancelAnimationFrame(animId);
            loop();
        }

        function loop() {
            if (!gameRunning) return;
            if (!paused) {
                update();
                render();
            } else {
                render(); // 暂停时仍渲染静态画面
            }
            animId = requestAnimationFrame(loop);
        }

        function update() {
            frameCount++;
            handlePlayerInput();

            player.update();
            if (playerFireCooldown > 0) playerFireCooldown--;

            if (enemy.alive && aiController) {
                aiController.update(player, walls);
            } else {
                enemy.update();
            }

            // 子弹更新 + 碰撞
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.update(walls);
                if (!b.alive) {
                    if (b.owner === 'player' && !b.hitTarget) {
                        playerMissCount++;
                        if (playerMissCount >= 3) {
                            triggerTaunt('playerContinuousMiss');
                            playerMissCount = 0;
                        } else {
                            triggerTaunt('playerMiss');
                        }
                    }
                    bullets.splice(i, 1);
                    continue;
                }

                // 玩家子弹 vs 敌人
                if (b.owner === 'player' && enemy.alive) {
                    if (b.hitsTank(enemy)) {
                        enemy.hp -= b.damage;
                        b.alive = false;
                        b.hitTarget = true;
                        playerMissCount = 0;
                        if (enemy.hp <= 0) {
                            enemy.alive = false;
                            // 本轮玩家胜利
                            if (roundActive) {
                                endRound('player');
                                return;
                            }
                        }
                        bullets.splice(i, 1);
                        continue;
                    }
                } else if (b.owner === 'enemy' && player.alive) {
                    if (b.hitsTank(player)) {
                        player.hp -= b.damage;
                        b.alive = false;
                        b.hitTarget = true;
                        if (player.hp <= 0) {
                            player.alive = false;
                            // 本轮AI胜利
                            if (roundActive) {
                                endRound('enemy');
                                return;
                            }
                        }
                        bullets.splice(i, 1);
                        continue;
                    }
                }
            }

            // 空闲检测
            if (player.alive) {
                if (playerFireCooldown === 0 && player.cooldown === 0) {
                    if (!playerShotThisFrame) {
                        playerIdleTimer++;
                        if (playerIdleTimer > 300) {
                            triggerTaunt('playerIdle');
                            playerIdleTimer = 0;
                        }
                    } else {
                        playerIdleTimer = 0;
                        playerShotThisFrame = false;
                    }
                } else {
                    playerIdleTimer = 0;
                }
            }
        }

        // 键盘状态
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            m: false
        };

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'm' || key === 'M') {
                e.preventDefault();
                if (!keys.m && player && player.alive && gameRunning && !paused) {
                    const bullet = player.fire();
                    if (bullet) {
                        bullets.push(bullet);
                        playerShotThisFrame = true;
                        playerIdleTimer = 0;
                    }
                }
                keys.m = true;
            } else if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
                e.preventDefault();
                keys[key] = true;
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'm' || key === 'M') {
                keys.m = false;
            } else if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
                keys[key] = false;
            }
        });

        function handlePlayerInput() {
            if (!player || !player.alive || paused) return;
            let dx = 0,
                dy = 0;
            if (keys.ArrowUp) dy = -1;
            if (keys.ArrowDown) dy = 1;
            if (keys.ArrowLeft) dx = -1;
            if (keys.ArrowRight) dx = 1;
            if (dx !== 0 || dy !== 0) {
                const ang = Math.atan2(dy, dx);
                let diff = ang - player.angle;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                const turnSpd = 0.08;
                if (Math.abs(diff) < turnSpd) {
                    player.angle = ang;
                } else {
                    player.angle += Math.sign(diff) * turnSpd;
                }
                const spd = player.speed;
                const moveX = Math.cos(player.angle) * spd;
                const moveY = Math.sin(player.angle) * spd;
                if (!player.tryMove(moveX, 0, walls)) { /* 阻塞 */ }
                if (!player.tryMove(0, moveY, walls)) { /* 阻塞 */ }
            }
        }

        // ================================================================
        //  轮结束 & 整局结束
        // ================================================================
        function endRound(winner) {
            if (!roundActive) return;
            roundActive = false;
            paused = true;

            // 更新轮胜
            if (winner === 'player') {
                roundWinsP++;
                triggerTaunt('playerWinRound');
            } else {
                roundWinsAI++;
                triggerTaunt('aiWinRound');
            }

            // 更新UI显示轮胜比分
            document.getElementById('score-player').textContent = roundWinsP;
            document.getElementById('score-ai').textContent = roundWinsAI;

            // 判断整局是否结束
            if (roundWinsP >= TARGET_WINS || roundWinsAI >= TARGET_WINS) {
                const victory = roundWinsP >= TARGET_WINS;
                gameOver(victory);
                return;
            }

            // 显示轮结束模态框
            const modal = document.getElementById('round-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            if (winner === 'player') {
                title.textContent = '🎉 你赢得了本轮！';
                desc.textContent = `当前比分：玩家 ${roundWinsP} - ${roundWinsAI} AI （先赢${TARGET_WINS}轮者胜）`;
            } else {
                title.textContent = '💀 AI赢得了本轮！';
                desc.textContent = `当前比分：玩家 ${roundWinsP} - ${roundWinsAI} AI （先赢${TARGET_WINS}轮者胜）`;
            }
            modal.classList.add('active');
            modal.style.display = 'flex !important';
            console.log('轮结束模态框已显示，当前暂停状态：', paused);
        }

        // 下一轮
        function nextRound() {
            const modal = document.getElementById('round-modal');
            modal.classList.remove('active');
            modal.style.display = 'none';

            // 增加轮次
            roundNum++;
            mapIndex = (mapIndex + 1) % MAPS.length;
            loadMap(mapIndex);
            document.getElementById('round-num').textContent = roundNum;
            // 重置坦克满血
            player.hp = player.maxHp;
            player.alive = true;
            enemy.hp = enemy.maxHp;
            enemy.alive = true;
            // 重置AI控制器
            aiController = new AIController(enemy, currentDifficulty);
            bullets = [];
            playerMissCount = 0;
            roundActive = true;
            paused = false;
            document.getElementById('game-status').textContent = '';
            console.log('进入下一轮，paused =', paused);
        }

        // 整局结束
        function gameOver(victory) {
            gameRunning = false;
            if (animId) cancelAnimationFrame(animId);
            document.getElementById('round-modal').classList.remove('active');
            document.getElementById('round-modal').style.display = 'none';
            // 金币结算
            let goldEarned = victory ? 50 : 20;
            const extra = Math.min(roundWinsP * 5, 25);
            goldEarned += extra;
            gameData.gold += goldEarned;
            saveStorage(gameData);
            const status = document.getElementById('game-status');
            status.textContent = victory ? `🏆 整局胜利！获得 ${goldEarned} 金币` : `💀 整局失败！获得 ${goldEarned} 金币`;
            setTimeout(() => {
                document.getElementById('game-screen').style.display = 'none';
                document.getElementById('menu-screen').style.display = 'block';
                gameRunning = false;
                paused = false;
                updateEquipUI();
            }, 2000);
        }

        // ================================================================
        //  渲染
        // ================================================================
        function render() {
            ctx.clearRect(0, 0, 800, 600);
            ctx.fillStyle = '#3a6b3a';
            ctx.fillRect(0, 0, 800, 600);
            ctx.strokeStyle = '#4a7a4a';
            ctx.lineWidth = 1;
            for (let i = 0; i < 800; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 600);
                ctx.stroke();
            }
            for (let i = 0; i < 600; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(800, i);
                ctx.stroke();
            }
            for (let w of walls) {
                ctx.fillStyle = '#6b4c2a';
                ctx.shadowColor = '#2a1a0a';
                ctx.shadowBlur = 6;
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.fillStyle = '#8b6c4a';
                ctx.shadowBlur = 0;
                for (let i = 0; i < w.w; i += 20) {
                    ctx.fillRect(w.x + i, w.y, 4, w.h);
                }
                ctx.shadowBlur = 0;
            }
            for (let b of bullets) {
                b.draw(ctx);
            }
            if (player) player.draw(ctx);
            if (enemy) enemy.draw(ctx);
            ctx.fillStyle = '#fff';
            ctx.font = '16px sans-serif';
            ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 10, 20);
            ctx.fillStyle = '#f5e56b';
            ctx.font = '18px sans-serif';
            ctx.fillText(`轮胜: 玩家 ${roundWinsP} - ${roundWinsAI} AI`, 660, 30);
            if (paused) {
                ctx.fillStyle = 'rgba(255,255,0,0.3)';
                ctx.font = '40px sans-serif';
                ctx.fillText('⏸️ 暂停', 320, 300);
            }
        }

        // ================================================================
        //  选择界面逻辑
        // ================================================================
        function initSelection() {
            const diffOpts = document.querySelectorAll('#diff-options .opt');
            diffOpts.forEach(el => {
                el.addEventListener('click', () => {
                    diffOpts.forEach(o => o.classList.remove('active'));
                    el.classList.add('active');
                    currentDifficulty = el.dataset.value;
                });
            });
            const typeOpts = document.querySelectorAll('#type-options .opt');
            typeOpts.forEach(el => {
                el.addEventListener('click', () => {
                    typeOpts.forEach(o => o.classList.remove('active'));
                    el.classList.add('active');
                    currentType = el.dataset.value;
                });
            });
            renderSkinOptions();
            document.getElementById('sel-back').addEventListener('click', () => {
                document.getElementById('selection-screen').style.display = 'none';
                document.getElementById('menu-screen').style.display = 'block';
            });
            document.getElementById('sel-go').addEventListener('click', () => {
                const activeSkin = document.querySelector('#skin-options .opt.active');
                if (activeSkin) {
                    currentSkin = activeSkin.dataset.value;
                    gameData.equippedSkin = currentSkin;
                    saveStorage(gameData);
                }
                initGame();
            });
        }

        function renderSkinOptions() {
            const container = document.getElementById('skin-options');
            container.innerHTML = '';
            SKIN_CONFIG.forEach(skin => {
                const unlocked = gameData.skins[skin.id] || false;
                const el = document.createElement('span');
                el.className = 'opt';
                if (currentSkin === skin.id) el.classList.add('active');
                el.dataset.value = skin.id;
                const colorBox = `<span class="skin-preview" style="background:${skin.color};"></span>`;
                const name = `<span class="skin-name">${skin.name}</span>`;
                const locked = unlocked ? '' : ' 🔒';
                el.innerHTML = colorBox + name + locked;
                if (!unlocked) {
                    el.style.opacity = '0.6';
                    el.title = `需要 ${skin.price} 金币解锁`;
                }
                el.addEventListener('click', () => {
                    if (!gameData.skins[skin.id]) {
                        alert(`请先在装备库解锁该皮肤！`);
                        return;
                    }
                    container.querySelectorAll('.opt').forEach(o => o.classList.remove('active'));
                    el.classList.add('active');
                    currentSkin = skin.id;
                    gameData.equippedSkin = skin.id;
                    saveStorage(gameData);
                });
                container.appendChild(el);
            });
        }

        // ================================================================
        //  装备库逻辑
        // ================================================================
        function initEquipment() {
            updateEquipUI();
            document.getElementById('equip-back').addEventListener('click', () => {
                document.getElementById('equipment-screen').style.display = 'none';
                document.getElementById('menu-screen').style.display = 'block';
            });
        }

        function updateEquipUI() {
            document.getElementById('equip-gold').textContent = gameData.gold;
            const ul = document.getElementById('upgrade-list');
            ul.innerHTML = '';
            UPGRADES.forEach(u => {
                const level = gameData.upgrades[u.id] || 0;
                const maxLv = u.maxLevel;
                const cost = u.baseCost + level * u.costInc;
                const isMax = level >= maxLv;
                const div = document.createElement('div');
                div.className = 'upgrade-item';
                div.innerHTML = `
                    <div class="info">
                        <span class="name">${u.name}</span>
                        <span class="desc">${u.desc}</span>
                    </div>
                    <div class="level">Lv.${level}/${maxLv}</div>
                    <button class="btn btn-small" ${isMax ? 'disabled' : ''} data-upgrade="${u.id}">
                        ${isMax ? '已满' : `升级 💰${cost}`}
                    </button>
                `;
                ul.appendChild(div);
                const btn = div.querySelector('button');
                if (!isMax) {
                    btn.addEventListener('click', () => {
                        const cost2 = u.baseCost + level * u.costInc;
                        if (gameData.gold < cost2) {
                            alert('金币不足！');
                            return;
                        }
                        gameData.gold -= cost2;
                        gameData.upgrades[u.id] = (gameData.upgrades[u.id] || 0) + 1;
                        saveStorage(gameData);
                        updateEquipUI();
                        if (player) player.recalcStats();
                        if (enemy) enemy.recalcStats();
                    });
                }
            });
            const sl = document.getElementById('skin-list');
            sl.innerHTML = '';
            SKIN_CONFIG.forEach(s => {
                const unlocked = gameData.skins[s.id] || false;
                const div = document.createElement('div');
                div.className = 'skin-item';
                const preview = `<span class="preview" style="background:${s.color};"></span>`;
                const name = `<span class="sname">${s.name}</span>`;
                let status = '';
                if (s.default) status = '默认';
                else if (unlocked) status = '已解锁';
                else status = `💰 ${s.price}`;
                const btnText = unlocked ? (currentSkin === s.id ? '已装备' : '装备') : '解锁';
                const btnDisabled = (unlocked && currentSkin === s.id) || (s.default);
                div.innerHTML = `
                    ${preview}
                    ${name}
                    <span class="status">${status}</span>
                    <button class="btn btn-small" ${btnDisabled ? 'disabled' : ''} data-skin="${s.id}">
                        ${btnText}
                    </button>
                `;
                sl.appendChild(div);
                const btn = div.querySelector('button');
                if (!btnDisabled) {
                    btn.addEventListener('click', () => {
                        if (!unlocked) {
                            if (gameData.gold < s.price) {
                                alert('金币不足！');
                                return;
                            }
                            gameData.gold -= s.price;
                            gameData.skins[s.id] = true;
                            saveStorage(gameData);
                            updateEquipUI();
                            renderSkinOptions();
                            return;
                        }
                        currentSkin = s.id;
                        gameData.equippedSkin = s.id;
                        saveStorage(gameData);
                        renderSkinOptions();
                        if (player) {
                            player.skinId = s.id;
                        }
                        updateEquipUI();
                    });
                }
            });
        }

        // ================================================================
        //  模态框事件绑定
        // ================================================================
        document.getElementById('modal-next').addEventListener('click', nextRound);
        document.getElementById('modal-menu').addEventListener('click', () => {
            document.getElementById('round-modal').classList.remove('active');
            document.getElementById('round-modal').style.display = 'none';
            gameRunning = false;
            paused = false;
            if (animId) cancelAnimationFrame(animId);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        });

        // ================================================================
        //  主菜单事件
        // ================================================================
        document.getElementById('btn-start').addEventListener('click', () => {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('selection-screen').style.display = 'block';
            renderSkinOptions();
        });
        document.getElementById('btn-equip').addEventListener('click', () => {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('equipment-screen').style.display = 'block';
            updateEquipUI();
        });
        document.getElementById('game-back').addEventListener('click', () => {
            gameRunning = false;
            paused = false;
            if (animId) cancelAnimationFrame(animId);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('round-modal').classList.remove('active');
            document.getElementById('round-modal').style.display = 'none';
        });

        // ================================================================
        //  初始化
        // ================================================================
        initSelection();
        initEquipment();
        console.log('坦克大战已加载！每轮一次生死对决，先赢3轮者胜。');
    </script>
</body>
</html>
